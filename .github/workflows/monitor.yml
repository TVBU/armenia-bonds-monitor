name: Armenia Bonds Monitor

on:
  schedule:
    - cron: "0 5 * * *"   # 9:00 Yerevan
    - cron: "0 14 * * *"  # 18:00 Yerevan
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Run monitor
        run: python monitor.py
      - name: Commit seen files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_bonds.json seen_news.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update seen state [skip ci]"
          git push || true
